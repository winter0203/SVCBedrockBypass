name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Use the Gradle version preinstalled on the GitHub-hosted runner.
      # setup-gradle's gradle-version provisioning hit HTTP 504 while downloading
      # the distribution, before the actual build could start.
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Show Gradle version
        run: gradle --version

      - name: Build plugin
        run: gradle --no-daemon clean build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVCBedrockBypass
          path: build/libs/SVCBedrockBypass-*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/libs/SVCBedrockBypass-*.jar
