name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的标签名称，例如 1.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Use the Gradle version preinstalled on the GitHub-hosted runner.
      # setup-gradle's gradle-version provisioning hit HTTP 504 while downloading
      # the distribution, before the actual build could start.
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Show Gradle version
        run: gradle --version

      - name: Build plugin
        run: gradle --no-daemon clean build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVCBedrockBypass
          path: build/libs/SVCBedrockBypass-*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: build/libs/SVCBedrockBypass-*.jar
